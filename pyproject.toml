[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transmitly"
version = "1.2.0"
description = "Dependency-free Python client for the Transmitly email API"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
keywords = ["email", "transactional", "smtp", "webhooks"]

[tool.setuptools]
py-modules = ["transmitly"]
